<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file:; script-src 'unsafe-inline'; style-src 'unsafe-inline'" />
    <title>API Bird setup</title>
    <style>
      :root {
        color-scheme: light dark;
        --paper: #f6f1e7; --ink: #1d2433; --muted: #6b6558; --line: #d9d0bd;
        --red: #d6453d; --blue: #1f4fa3; --field: #fffdf8; --focus: #1f4fa3;
        font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #141a26; --ink: #ece6d8; --muted: #8f97a8; --line: #2b3446;
          --red: #e8625a; --blue: #6c9cf0; --field: #0e131c; --focus: #8fb4ff;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      /* Airmail envelope border */
      body {
        background: repeating-linear-gradient(-45deg, var(--red) 0 14px, var(--paper) 14px 22px, var(--blue) 22px 36px, var(--paper) 36px 44px);
        padding: 8px; color: var(--ink);
      }
      main {
        height: 100%; background: var(--paper); padding: 22px 24px;
        display: flex; flex-direction: column; position: relative; overflow: auto;
      }
      header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
      .logo { flex: none; height: 60px; width: auto; }
      h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
      header p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
      .postmark {
        position: absolute; bottom: 16px; right: 20px; width: 64px; height: 64px;
        border: 2px solid var(--muted); border-radius: 50%; opacity: 0.35;
        display: grid; place-items: center; text-align: center;
        font: 700 9px/1.2 ui-monospace, Menlo, monospace; letter-spacing: 0.08em;
        color: var(--muted); transform: rotate(12deg); pointer-events: none;
      }
      label {
        display: block; margin: 0 0 5px; font-size: 11px; font-weight: 700;
        letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
      }
      input {
        width: 100%; padding: 9px 11px; border: 1.5px solid var(--line); border-radius: 6px;
        background: var(--field); color: var(--ink);
        font: 13px ui-monospace, "SF Mono", Menlo, monospace;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      input:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
      input::placeholder { color: var(--muted); opacity: 0.7; }
      fieldset { border: 0; padding: 0; margin: 0 0 14px; display: flex; gap: 8px; }
      fieldset label {
        flex: 1; margin: 0; padding: 9px 11px; border: 1.5px solid var(--line); border-radius: 6px;
        background: var(--field); color: var(--ink); cursor: pointer;
        font: 600 13px system-ui, sans-serif; letter-spacing: 0; text-transform: none;
      }
      fieldset label:has(:checked) { border-color: var(--focus); }
      fieldset label:has(:focus-visible) { box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
      fieldset input { width: auto; margin: 0 6px 0 0; accent-color: var(--focus); }
      .note { margin: 0 0 14px; color: var(--muted); font-size: 12px; }
      .row { display: flex; gap: 12px; align-items: end; margin-top: 14px; }
      .row > div { width: 110px; }
      button {
        flex: 1; height: 38px; border: 0; border-radius: 6px; cursor: pointer;
        background: var(--red); color: #fff; font: 600 14px system-ui, sans-serif;
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        box-shadow: 0 2px 0 color-mix(in srgb, var(--red) 60%, #000);
        transition: transform 0.08s, filter 0.15s;
      }
      button:hover { filter: brightness(1.07); }
      button:active { transform: translateY(1px); box-shadow: none; }
      button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
      button:disabled { cursor: progress; filter: saturate(0.6); }
      button svg { width: 16px; height: 16px; transition: transform 0.3s; }
      button:hover:not(:disabled) svg { transform: translate(2px, -2px); }
      button:disabled svg { animation: fly 0.9s ease-in-out infinite alternate; }
      @keyframes fly { to { transform: translate(4px, -3px) rotate(-8deg); } }
      #error {
        white-space: pre-wrap; margin-top: 14px; font: 12px/1.45 ui-monospace, Menlo, monospace;
        color: var(--red); border-left: 3px solid var(--red); padding: 6px 10px;
        background: color-mix(in srgb, var(--red) 9%, transparent); border-radius: 0 4px 4px 0;
      }
      #error:empty { display: none; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <main>
      <div class="postmark" aria-hidden="true">API&nbsp;BIRD<br />·<br />LOCAL</div>
      <header>
        <img class="logo" src="../public/logo.svg" alt="" />
        <div>
          <h1>Set up API Bird</h1>
          <p>Where should your requests nest? Pick a store.</p>
        </div>
      </header>
      <form id="form">
        <fieldset>
          <legend hidden>Storage</legend>
          <label><input type="radio" name="driver" value="nedb" checked />Built-in</label>
          <label><input type="radio" name="driver" value="mongo" />MongoDB</label>
        </fieldset>
        <p class="note">Each option keeps its own data; switching doesn't copy anything across.</p>
        <div id="mongo" hidden>
          <label for="uri">MongoDB URI</label>
          <input id="uri" placeholder="mongodb://localhost:27017/api-bird" spellcheck="false" autocomplete="off" />
        </div>
        <div class="row">
          <div>
            <label for="port">Port</label>
            <input id="port" type="number" min="1024" max="65535" required value="3940" />
          </div>
          <button id="save">
            <span id="saveText">Test &amp; save</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
        <div id="error" role="alert"></div>
      </form>
    </main>
    <script>
      const q = new URLSearchParams(location.search);
      const $ = (id) => document.getElementById(id);
      const driver = () => document.querySelector("[name=driver]:checked").value;
      const sync = () => {
        const mongo = driver() === "mongo";
        $("mongo").hidden = !mongo;
        $("uri").required = mongo;
      };
      for (const r of document.getElementsByName("driver")) r.onchange = () => (sync(), r.value === "mongo" && $("uri").focus());
      if (q.get("driver") === "mongo") document.querySelector("[value=mongo]").checked = true;
      sync();
      if (q.get("uri")) $("uri").value = q.get("uri");
      if (q.get("port")) $("port").value = q.get("port");
      $("error").textContent = q.get("error") ?? "";
      $("form").onsubmit = async (e) => {
        e.preventDefault();
        $("save").disabled = true;
        $("saveText").textContent = "Testing…";
        $("error").textContent = "";
        const error = await window.api.testAndSave({ driver: driver(), uri: $("uri").value.trim(), port: Number($("port").value) });
        $("error").textContent = error ?? "";
        $("save").disabled = false;
        $("saveText").textContent = "Test & save";
      };
    </script>
  </body>
</html>
